<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manuscript: visual LaTeX editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--desk:#dde3ea;--bar:#f7f8fa;--line:#c9d0da;--ink:#1d2430;--mute:#5d6878;--acc:#2f5fa8;--accbg:#dce8fa;--paper:#fff;--pink:#1d1d1f;--raw:#f4efe2;--rawl:#8a6d1d;--math:#eef3fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--desk:#12161c;--bar:#1c222b;--line:#323b49;--ink:#e6eaf0;--mute:#97a3b4;--acc:#7aa6ee;--accbg:#27395a;--raw:#2d291c;--rawl:#d2b565;--math:#232c3b}}
:root[data-theme="dark"]{color-scheme:dark;--desk:#12161c;--bar:#1c222b;--line:#323b49;--ink:#e6eaf0;--mute:#97a3b4;--acc:#7aa6ee;--accbg:#27395a;--raw:#2d291c;--rawl:#d2b565;--math:#232c3b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--desk);color:var(--ink);font:14px/1.4 "IBM Plex Sans",system-ui,sans-serif;display:flex;flex-direction:column}
.ribbon{background:var(--bar);border-bottom:1px solid var(--line);display:flex;gap:0;overflow-x:auto;flex:none;padding:6px 8px 0}
.grp{display:flex;flex-direction:column;padding:0 10px;border-right:1px solid var(--line);flex:none}
.grp:last-child{border-right:0}
.row{display:flex;gap:4px;align-items:center;min-height:34px}
.gl{font-size:11px;color:var(--mute);text-align:center;padding:2px 0 4px}
button,select{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:4px;min-height:32px;min-width:32px;padding:0 9px;cursor:pointer}
button:hover,select:hover{background:var(--accbg)}
button:focus-visible,select:focus-visible,textarea:focus-visible,.page:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button[aria-pressed="true"]{background:var(--accbg);border-color:var(--acc)}
select{border-color:var(--line);background:var(--bar)}
.sep{font-family:"Source Serif 4",serif}
.stage{flex:1;overflow:auto;padding:22px 12px 60px;position:relative}
.drawer{max-width:794px;margin:0 auto 14px;background:var(--bar);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.drawer p{margin:0 0 6px;color:var(--mute);font-size:12.5px}
textarea{width:100%;min-height:150px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--pink);border:1px solid var(--line);border-radius:4px;padding:8px;resize:vertical}
.page{max-width:794px;min-height:1000px;margin:0 auto;background:var(--paper);color:var(--pink);padding:72px 80px;box-shadow:0 1px 3px rgba(0,0,0,.25),0 8px 28px rgba(0,0,0,.12);font:17px/1.62 "Source Serif 4",Georgia,serif;outline:0}
@media (max-width:700px){.page{padding:28px 20px;font-size:16px}}
.page p{margin:0 0 .9em;text-align:justify;hyphens:auto}
.page h1{font-size:1.55em;margin:1.2em 0 .5em;line-height:1.25}
.page h2{font-size:1.28em;margin:1.1em 0 .4em;line-height:1.25}
.page h3{font-size:1.1em;margin:1em 0 .3em;font-style:italic}
.page ul,.page ol{margin:0 0 .9em;padding-left:1.6em}
.page code{font-size:.9em}
.raw{background:var(--raw);border-left:3px solid var(--rawl);margin:0 0 .9em;padding:6px 10px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;color:#5b4a12;border-radius:2px;cursor:default;position:relative}
.raw::before{content:"LaTeX kept as written";display:block;font:500 11px "IBM Plex Sans",sans-serif;color:var(--rawl);margin-bottom:3px}
.rawi{background:var(--raw);color:#5b4a12;font:.82em ui-monospace,Menlo,Consolas,monospace;padding:0 4px;border-radius:3px;border-bottom:1px solid var(--rawl)}
.math{background:var(--math);font-style:italic;border-radius:3px;padding:0 4px;cursor:pointer;color:#1b3f7a}
div.math{display:block;text-align:center;padding:10px 12px;margin:0 0 .9em;position:relative;font-size:1.05em;white-space:pre-wrap}
div.math::after{content:attr(data-env);position:absolute;right:8px;top:3px;font:11px "IBM Plex Sans",sans-serif;font-style:normal;color:var(--mute)}
.cite{color:var(--acc);cursor:pointer;font-style:normal;font-size:.95em}
.page table{border-collapse:collapse;margin:0 auto 1em}.page td{border:1px solid #9aa4b2;padding:4px 12px;min-width:64px;text-align:left}
.status{flex:none;display:flex;gap:16px;padding:5px 12px;background:var(--acc);color:#fff;font-size:12px;overflow-x:auto;white-space:nowrap}
.src{max-width:794px;margin:0 auto}
.src textarea{min-height:70vh}
.xmlpane{flex:none;height:42vh;display:flex;flex-direction:column;background:var(--bar);border-top:1px solid var(--line)}
.xmlpane .row{padding:4px 10px;gap:8px}.xmlpane textarea{flex:1;min-height:0;border:0;border-radius:0;resize:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 6px}.meta input,.xmlpane select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;min-height:30px;padding:0 8px;width:128px}.xmlpane select{width:auto;background:var(--bar)}
#xmlState{color:var(--mute);font-size:12px;margin-left:auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="ribbon" role="toolbar" aria-label="Formatting">
  <div class="grp"><div class="row">
    <button data-act="open">Open .tex</button><button data-act="copy">Copy LaTeX</button><button data-act="save">Download</button>
  </div><div class="gl">File</div></div>
  <div class="grp"><div class="row">
    <button data-cmd="undo" title="Undo">↶</button><button data-cmd="redo" title="Redo">↷</button>
    <select id="style" aria-label="Paragraph style"><option value="p">Body text</option><option value="h1">Section</option><option value="h2">Subsection</option><option value="h3">Subsubsection</option></select>
  </div><div class="gl">Styles</div></div>
  <div class="grp"><div class="row">
    <button data-cmd="bold" title="Bold"><b>B</b></button><button data-cmd="italic" title="Italic"><i class="sep">I</i></button><button data-cmd="underline" title="Underline"><u>U</u></button>
    <button data-cmd="insertUnorderedList" title="Bullets">• List</button><button data-cmd="insertOrderedList" title="Numbered">1. List</button>
  </div><div class="gl">Font and paragraph</div></div>
  <div class="grp"><div class="row">
    <button data-act="imath">Inline math</button><button data-act="bmath">Equation</button><button data-act="cite">Citation</button><button data-act="ref">Cross-reference</button><button data-act="tbl">Table</button><button data-act="addrow">+ Row</button><button data-act="addcol">+ Column</button>
  </div><div class="gl">Insert</div></div>
  <div class="grp"><div class="row">
    <button data-act="pre" aria-pressed="false">Preamble</button><button data-act="source" aria-pressed="false">Show source</button><button data-act="xml" aria-pressed="false">XML</button>
  </div><div class="gl">View</div></div>
</div>

<div class="stage" id="stage">
  <div class="drawer" id="preDrawer" hidden>
    <p>Preamble: packages, macros, title and author. Kept exactly as written and saved untouched.</p>
    <textarea id="pre" spellcheck="false" aria-label="LaTeX preamble"></textarea>
  </div>
  <div class="src" id="srcView" hidden>
    <textarea id="srcText" spellcheck="false" aria-label="LaTeX source"></textarea>
  </div>
  <div class="page" id="ed" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Document"></div>
</div>
<div class="xmlpane" id="xmlPane" hidden>
  <div class="row"><b>XML output</b><select id="xmlFmt" aria-label="XML format"><option value="app">Springer A++ V2.4</option><option value="jats">JATS-style</option></select><button id="xmlCopy">Copy XML</button><button id="xmlSave">Download XML</button><span id="xmlState"></span></div>
  <div class="meta" id="appMeta"><input id="mJt" placeholder="Journal title" aria-label="Journal title"><input id="mJid" placeholder="Journal ID" aria-label="Journal ID"><input id="mVol" placeholder="Volume" aria-label="Volume"><input id="mIss" placeholder="Issue" aria-label="Issue"><input id="mAid" placeholder="Article ID" aria-label="Article ID"><input id="mDoi" placeholder="DOI" aria-label="DOI"><input id="mCat" placeholder="Article category" aria-label="Article category"></div>
  <textarea id="xmlText" readonly spellcheck="false" aria-label="Generated XML"></textarea>
</div>
<div class="status"><span id="stWords">0 words</span><span id="stLocked">0 locked LaTeX items</span><span id="stMsg">Click an equation or citation to edit it.</span></div>
<input type="file" id="file" accept=".tex,.txt,text/plain" hidden>

<script>
const SAMPLE = String.raw`\documentclass[11pt]{article}
\usepackage{amsmath}
\usepackage{graphicx}
\newcommand{\R}{\mathbb{R}}
\title{Heat Flow in Thin Rods}
\author{A. Researcher}

\begin{document}
\maketitle

\begin{abstract}
We study heat conduction in a thin rod and compare it with experiments.
\end{abstract}

\section{Introduction}
Heat flow in a rod is a \textbf{classical} problem, first studied by Fourier \cite{fourier1822}. Here we write the temperature as $u(x,t)$ and look at \emph{small} perturbations.

% TODO: add motivation paragraph
\section{Model}
The temperature satisfies the heat equation on $\R$:

\begin{equation}
\frac{\partial u}{\partial t} = \alpha \frac{\partial^2 u}{\partial x^2}
\end{equation}

We make three assumptions:
\begin{itemize}
  \item the rod is homogeneous;
  \item the ends are \underline{insulated};
  \item the initial profile is smooth, see Section~\ref{sec:results}.
\end{itemize}

\subsection{Measurements}
\begin{tabular}{ll}
Material & Conductivity \\
Copper & 401 \\
\end{tabular}

\section{Results}\label{sec:results}
The measured values agree with the model to within experimental error.

\end{document}
`;
const $ = id => document.getElementById(id);
const ed = $('ed'), INL = {textbf:'strong',emph:'em',textit:'em',underline:'u',texttt:'code'}, REFS = ['cite','citep','citet','ref','eqref'];
let post = '\n', saved = null, srcMode = false;

const mk = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const mb = (s, i) => { let d = 0; for (; i < s.length; i++) { const c = s[i]; if (c === '\\') { i++; continue; } if (c === '{') d++; else if (c === '}' && --d === 0) return i; } return -1; };
const esc = s => s.replace(/[\\%&#_${}]/g, m => m === '\\' ? '\\textbackslash{}' : '\\' + m);

/* ---------- LaTeX -> editor ---------- */
function rawInline(src){ const e = mk('span','rawi',src); e.contentEditable = 'false'; e.dataset.raw = src; return e; }
function mathInline(src){ const e = mk('span','math',src.replace(/^\$|\$$/g,'')); e.contentEditable = 'false'; e.dataset.tex = src; return e; }
function refChip(cmd, key){ const e = mk('span','cite', cmd.startsWith('cite') ? '['+key+']' : '('+key+')'); e.contentEditable = 'false'; e.dataset.cmd = cmd; e.dataset.key = key; return e; }

function inline(s){
  const f = document.createDocumentFragment(); let buf = '';
  const fl = () => { if (buf) { f.append(buf); buf = ''; } };
  for (let i = 0; i < s.length;) {
    const c = s[i];
    if (c === '$') { const j = s.indexOf('$', i+1); if (j > 0) { fl(); f.append(mathInline(s.slice(i,j+1))); i = j+1; continue; } }
    if (c === '%') { let j = s.indexOf('\n', i); if (j < 0) j = s.length; fl(); f.append(rawInline(s.slice(i,j))); i = j; continue; }
    if (c === '\\') {
      const nx = s[i+1];
      if (nx && '%&#_${}'.includes(nx)) { buf += nx; i += 2; continue; }
      const re = /\\([a-zA-Z]+)\*?/y; re.lastIndex = i; const m = re.exec(s);
      if (!m) { fl(); f.append(rawInline(s.slice(i,i+2))); i += 2; continue; }
      const name = m[1]; const j = i + m[0].length;
      if (s[j] === '{' && (INL[name] || REFS.includes(name))) {
        const e = mb(s, j);
        if (e > 0) {
          fl();
          if (INL[name]) { const el = mk(INL[name]); el.append(inline(s.slice(j+1,e))); f.append(el); }
          else f.append(refChip(name, s.slice(j+1,e)));
          i = e+1; continue;
        }
      }
      let k = j;
      for (;;) {
        if (s[k] === '[') { const q = s.indexOf(']', k); if (q < 0) break; k = q+1; }
        else if (s[k] === '{') { const e = mb(s, k); if (e < 0) break; k = e+1; }
        else break;
      }
      fl(); f.append(rawInline(s.slice(i,k))); i = k; continue;
    }
    buf += c === '\n' ? ' ' : c; i++;
  }
  fl(); return f;
}

function mathBlock(src){
  const e = mk('div','math'); e.contentEditable = 'false'; e.dataset.tex = src;
  let m = /^\s*\\begin\{([a-zA-Z*]+)\}([\s\S]*)\\end\{\1\}\s*$/.exec(src), inner = src, env = 'math';
  if (m) { env = m[1]; inner = m[2].trim(); }
  else if ((m = /^\s*\\\[([\s\S]*)\\\]\s*$/.exec(src))) { env = '\\[ \\]'; inner = m[1].trim(); }
  e.dataset.env = env; e.textContent = inner; return e;
}

function rawBlock(src){ const e = mk('div','raw',src.trim()); e.contentEditable = 'false'; e.dataset.raw = src; return e; }

function tableBlock(buf){
  const m = /^\s*\\begin\{tabular\}\{([^{}]*)\}\s*(.*)$/.exec(buf[0]); if (!m) return null;
  const last = buf[buf.length-1];
  if (buf.length < 2 || !/\\end\{tabular\}\s*$/.test(last) || last.replace(/\\end\{tabular\}\s*$/,'').trim()) return null;
  const rest = [m[2], ...buf.slice(1,-1)].join('\n');
  if (/\\(hline|multicolumn|multirow|begin|cline|toprule|midrule|bottomrule)/.test(rest)) return null;
  const t = mk('table'), tb = mk('tbody'); t.dataset.spec = m[1]; t.append(tb);
  rest.split('\\\\').forEach(r => { if (!r.trim()) return; const tr = mk('tr'); r.split(/(?<!\\)&/).forEach(c => { const td = mk('td'); td.append(inline(c.trim())); tr.append(td); }); tb.append(tr); });
  return tb.children.length ? t : null;
}
function parse(body){
  const L = body.replace(/\r/g,'').split('\n'), out = []; let p = [];
  const push = (el, src) => { el.dataset.src = src; out.push(el); };
  const SOLO = /^(\\[a-zA-Z]+\*?(\[[^\]]*\])*(\{[^{}]*\})*[ \t]*\n?|%[^\n]*\n?)+$/;
  const fp = () => {
    if (!p.length) return; const src = p.join('\n').trim(); p = []; if (!src) return;
    const m = /^\\([a-zA-Z]+)/.exec(src);
    if (SOLO.test(src) && !(m && (INL[m[1]] || REFS.includes(m[1])))) { push(rawBlock(src), src); return; }
    const el = mk('p'); el.append(inline(src)); push(el, src);
  };
  for (let i = 0; i < L.length; i++) {
    const ln = L[i]; let m;
    if (!ln.trim()) { fp(); continue; }
    if ((m = /^\s*\\((?:sub){0,2})section(\*?)\s*\{/.exec(ln))) {
      const j = m[0].length-1, e = mb(ln, j);
      if (e > 0) { fp(); const h = mk('h'+(m[1].length/3+1)); h.append(inline(ln.slice(j+1,e))); h.dataset.star = m[2]; h.dataset.tail = ln.slice(e+1).trim(); push(h, ln.trim()); continue; }
    }
    if ((m = /^\s*\\begin\{([a-zA-Z*]+)\}/.exec(ln))) {
      fp(); const name = m[1], ob = '\\begin{'+name+'}', cb = '\\end{'+name+'}'; let depth = 0, buf = [];
      for (; i < L.length; i++) { buf.push(L[i]); depth += L[i].split(ob).length-1; depth -= L[i].split(cb).length-1; if (depth <= 0) break; }
      const src = buf.join('\n');
      if (/^(equation|align|gather|multline|eqnarray|displaymath)\*?$/.test(name)) push(mathBlock(src), src);
      else if (name === 'itemize' || name === 'enumerate') {
        const inner = buf.slice(1,-1).join('\n');
        if (/\\begin\{/.test(inner) || buf.length < 2) push(rawBlock(src), src);
        else { const el = mk(name === 'itemize' ? 'ul' : 'ol'); inner.split(/\\item\b/).slice(1).forEach(t => { const li = mk('li'); li.append(inline(t.trim())); el.append(li); }); push(el, src); }
      } else { const tb = name === 'tabular' && tableBlock(buf); push(tb || rawBlock(src), src); }
      continue;
    }
    if (/^\s*\\\[/.test(ln)) { fp(); let buf = []; for (; i < L.length; i++) { buf.push(L[i]); if (/\\\]/.test(L[i])) break; } const src = buf.join('\n'); push(mathBlock(src), src); continue; }
    p.push(ln);
  }
  fp(); return out;
}

/* ---------- editor -> LaTeX ---------- */
function inl(n){
  let s = '';
  n.childNodes.forEach(c => {
    if (c.nodeType === 3) { s += esc(c.nodeValue.replace(/\u00a0/g,' ')); return; }
    if (c.nodeType !== 1) return;
    const t = c.tagName, cl = c.classList;
    if (cl.contains('rawi')) s += c.dataset.raw;
    else if (cl.contains('math')) s += c.dataset.tex;
    else if (cl.contains('cite')) s += '\\'+c.dataset.cmd+'{'+c.dataset.key+'}';
    else if (t === 'BR') s += ' ';
    else { const w = {STRONG:'textbf',B:'textbf',EM:'emph',I:'emph',U:'underline',CODE:'texttt'}[t], i = inl(c); s += (w && i) ? '\\'+w+'{'+i+'}' : i; }
  });
  return s;
}
function ser(root){
  const out = [];
  root.childNodes.forEach(n => {
    if (n.nodeType === 3) { const t = n.nodeValue.trim(); if (t) out.push(esc(t)); return; }
    if (n.nodeType !== 1) return;
    if (n.dataset.src !== undefined && n.dataset.h === n.innerHTML) { out.push(n.dataset.src); return; }
    const t = n.tagName, cl = n.classList;
    if (cl.contains('raw')) { out.push(n.dataset.raw); return; }
    if (cl.contains('math')) { out.push(n.dataset.tex); return; }
    if (/^H[1-3]$/.test(t)) { out.push('\\'+'sub'.repeat(+t[1]-1)+'section'+(n.dataset.star||'')+'{'+inl(n).trim()+'}'+(n.dataset.tail||'')); return; }
    if (t === 'TABLE') { const rows = [...n.rows]; out.push('\\begin{tabular}{'+(n.dataset.spec || 'l'.repeat(rows[0] ? rows[0].cells.length : 1))+'}\n'+rows.map(r => '  '+[...r.cells].map(c => inl(c).trim()).join(' & ')+' \\\\').join('\n')+'\n\\end{tabular}'); return; }
    if (t === 'UL' || t === 'OL') { const e = t === 'UL' ? 'itemize' : 'enumerate'; out.push('\\begin{'+e+'}\n'+[...n.children].map(li => '  \\item '+inl(li).trim()).join('\n')+'\n\\end{'+e+'}'); return; }
    const x = inl(n).trim(); if (x) out.push(x);
  });
  return out.join('\n\n');
}
const fullTex = () => $('pre').value.replace(/\s+$/,'') + '\n\n\\begin{document}\n\n' + ser(ed) + '\n\n\\end{document}\n' + post.replace(/^\n+/,'');

/* ---------- load / render ---------- */
function load(tex){
  const i = tex.indexOf('\\begin{document}'), j = tex.lastIndexOf('\\end{document}');
  let pre = '', body = tex;
  if (i >= 0 && j > i) { pre = tex.slice(0,i); body = tex.slice(i+16,j); post = tex.slice(j+14); }
  $('pre').value = pre.trim();
  ed.replaceChildren(...parse(body));
  [...ed.children].forEach(c => { if (c.dataset.src !== undefined) c.dataset.h = c.innerHTML; });
  stats();
}
function stats(){
  $('stWords').textContent = (ed.innerText.trim().split(/\s+/).filter(Boolean).length) + ' words';
  const n = ed.querySelectorAll('.raw,.rawi').length;
  $('stLocked').textContent = n + ' locked LaTeX item' + (n === 1 ? '' : 's');
  clearTimeout(xt); xt = setTimeout(xmlRefresh, 200);
}
const msg = t => { $('stMsg').textContent = t; };

/* ---------- editing helpers ---------- */
document.execCommand('defaultParagraphSeparator', false, 'p');
document.addEventListener('selectionchange', () => {
  const s = getSelection(); if (!s.rangeCount || !ed.contains(s.anchorNode)) return;
  saved = s.getRangeAt(0).cloneRange();
  let n = s.anchorNode; while (n && n.parentNode !== ed) n = n.parentNode;
  const t = n && n.tagName ? n.tagName.toLowerCase() : 'p'; $('style').value = /^h[1-3]$/.test(t) ? t : 'p';
});
function restore(){ ed.focus(); if (saved) { const s = getSelection(); s.removeAllRanges(); s.addRange(saved); } }
function insertNode(node){
  restore(); const s = getSelection(); if (!s.rangeCount) return;
  const r = s.getRangeAt(0); r.deleteContents(); r.insertNode(node);
  const sp = document.createTextNode('\u00a0'); node.after(sp); r.setStartAfter(sp); r.collapse(true); s.removeAllRanges(); s.addRange(r); stats();
}
function insertBlock(node){
  restore(); let n = saved ? saved.startContainer : null; while (n && n.parentNode !== ed) n = n.parentNode;
  if (n) n.after(node); else ed.append(node);
  if (!node.nextSibling) ed.append(mk('p','',''), ); stats();
}
function setMath(el, inner){
  if (el.tagName === 'DIV') { const env = el.dataset.env; el.dataset.tex = env === '\\[ \\]' ? '\\[\n'+inner+'\n\\]' : '\\begin{'+env+'}\n'+inner+'\n\\end{'+env+'}'; }
  else el.dataset.tex = '$'+inner+'$';
  el.textContent = inner;
}

document.querySelector('.ribbon').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
document.querySelector('.ribbon').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.cmd) { restore(); document.execCommand(b.dataset.cmd); stats(); return; }
  const a = b.dataset.act;
  if (a === 'imath') { const v = prompt('Inline math (LaTeX)', 'x^2 + y^2'); if (v) insertNode(mathInline('$'+v+'$')); }
  else if (a === 'bmath') { const v = prompt('Equation (LaTeX)', 'E = mc^2'); if (v) insertBlock(mathBlock('\\begin{equation}\n'+v+'\n\\end{equation}')); }

    else if (cl.contains('math')) s += '<inline-formula><tex-math>'+xe(c.dataset.tex.replace(/^\$|\$$/g,''))+'</tex-math></inline-formula>';
    else if (cl.contains('cite')) s += '<xref ref-type="'+(c.dataset.cmd.startsWith('cite') ? 'bibr' : 'sec')+'" rid="'+xa(c.dataset.key)+'"/>';
    else if (t === 'BR') s += ' ';

function toXml(){

  if (au) L.push('      <contrib-group>'+au.split(/;\s*|\\and\s*/).filter(Boolean).map(a => '<contrib contrib-type="author"><string-name>'+xe(a)+'</string-name></contrib>').join('')+'</contrib-group>');

    const t = n.tagName, cl = n.classList;
    if (/^H[1-3]$/.test(t)) { const lv = +t[1]; while (stack.length && stack[stack.length-1] >= lv) { stack.pop(); add('</sec>'); } add('<sec>'); stack.push(lv); add('<title>'+xin(n).trim()+'</title>'); return; }
